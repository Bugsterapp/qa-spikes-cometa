name: Usuario paga colegiatura con tarjeta de crédito mediante Kushki exitosamente
page: /guardians
page_path: apps/guardian_frontend/pages/guardians/[guardianHash]/index.tsx
starting_url: https://api-demo.dev.getcometa.com/cometa_admin/students/guardian/
hooks:
  before:
    # Obtener datos de la escuela
    - helper: getSchoolIdByName
      file_path: apps/e2e/helpers/commons.ts
      args: ["Instituto Internacional Carlos"]
      as: schoolId

    # Obtener entidad fiscal y cuenta bancaria
    - helper: getFiscalEntityBySchoolId
      file_path: apps/e2e/helpers/commons.ts
      args: ["{{schoolId}}"]
      as: fiscalEntity

    - helper: getBankAccountBySchoolName
      file_path: apps/e2e/helpers/commons.ts
      args: ["Instituto Internacional Carlos"]
      as: bankAccount

    # Obtener nivel y sección
    - helper: getLevelIdBySchoolId
      file_path: apps/e2e/helpers/commons.ts
      args: ["{{schoolId}}", "Primaria"]
      as: levelId

    - helper: getSectionIdBySchoolId
      file_path: apps/e2e/helpers/commons.ts
      args: ["{{schoolId}}", "{{levelId}}"]
      as: sectionId

    # Obtener ciclo escolar activo
    - helper: getActiveSchoolCycleBySchoolId
      file_path: apps/e2e/helpers/commons.ts
      args: ["{{schoolId}}", true]
      as: cycle

    # Generar datos del estudiante
    - helper: generateFirstName
      file_path: apps/e2e/helpers/students.ts
      as: firstName

    - helper: generateLastName
      file_path: apps/e2e/helpers/students.ts
      as: lastName

    - helper: generateLastName
      file_path: apps/e2e/helpers/students.ts
      as: studentMotherLastName

    - helper: generateMatricula
      file_path: apps/e2e/helpers/students.ts
      as: matricula

    - helper: generarCURP
      file_path: apps/e2e/helpers/commons.ts
      args: ["{{lastName}}", "{{studentMotherLastName}}", "{{firstName}}"]
      as: curp

    # Generar datos del tutor
    - helper: generateFirstName
      file_path: apps/e2e/helpers/students.ts
      as: guardianFirstName

    - helper: generateLastName
      file_path: apps/e2e/helpers/students.ts
      as: guardianLastName

    # Crear concepto de pago mensual (usando precio fijo ya que el original usa faker inline)
    - helper: createConcept
      file_path: apps/e2e/helpers/concepts.ts
      args:
        [
          "Concepto Colegiatura Test",
          "1000",
          "{{fiscalEntity}}",
          "{{cycle[0].id}}",
          "{{bankAccount.id}}",
          "{{schoolId}}",
        ]
      as: conceptId

    # Crear estudiante
    - helper: createStudentWithParams
      file_path: apps/e2e/helpers/students.ts
      args:
        [
          "{{firstName}}",
          "{{lastName}}",
          "{{matricula}}",
          "{{levelId}}",
          "{{sectionId}}",
          "{{schoolId}}",
          "{{curp}}",
          null,
          null,
          "{{cycle[0].id}}",
        ]
      as: studentId

    # Generar email del tutor
    - helper: generateEmail
      file_path: apps/e2e/helpers/commons.ts
      args: ["{{guardianFirstName}}", "{{guardianLastName}}"]
      as: guardianEmail

    # Asignar tutor al estudiante
    - helper: assignGuardianAPI
      file_path: apps/e2e/helpers/students.ts
      args:
        [
          "{{studentId}}",
          "{{schoolId}}",
          "{{guardianFirstName}}",
          "{{guardianLastName}}",
          "{{guardianEmail}}",
        ]
      as: guardianName

    # Asignar órdenes del concepto al estudiante
    - helper: addOrdersToStudent
      file_path: apps/e2e/helpers/concepts.ts
      args: ["{{studentId}}", "{{conceptId}}"]
      as: assignment

task: Verificar que un tutor puede pagar una colegiatura con tarjeta de crédito mediante el procesador de pagos Kushki
steps:
  # Step 1: Login to Django Admin (starts at https://api-demo.dev.getcometa.com/cometa_admin/students/guardian/)
  - Enter email automationadmin@getcometa.com in the "Email address" field
  - Enter password barriletecosmico in the "Password" field
  - Click "Log in" button
  # Step 2: Search and select the guardian
  - Enter "{{data.guardianFirstName}} {{data.guardianLastName}}" in the search box
  - Click "Search" button
  - Select the checkbox next to the guardian {{data.guardianEmail}} in the results table
  # Step 3: Generate Auth URL
  - Select "Generate Auth URL" from the "Action" dropdown
  - Click "Go" button
  - Wait for the auth URL to be generated and displayed
  - Copy the guardian portal URL from the "Auth url for..." message
  # Step 4: Navigate to Guardian Portal with the generated URL
  - Extract the token from the "Auth url for..." message by taking everything after the colon ":"
  - Construct the portal URL by concatenating the portal base URL (https://portal.demo.getcometa.com) with the extracted token
  - Navigate to the constructed guardian portal URL
  # Step 5: Complete Onboarding
  - Accept terms and conditions checkbox
  - Click "Comenzar" button to start onboarding
  - Click "Continuar" to skip guardian data section
  - Click "Continuar" to skip student data section
  - Click "Por ahora no" to skip billing information
  - Click "Iniciar" to complete onboarding and go to home
  # Step 6: Close any tour messages
  - Close any tour or helper messages if displayed
  # Step 7: Select concept and proceed to payment
  - Locate the concept card for "Concepto Colegiatura Test - Agosto, 2023"
  - Click "SELECCIONAR" button on the concept card
  - Click "Pagar" button to proceed to checkout
  # Step 8: Confirm payment intent
  - Click "PAGAR" button to initiate payment
  - Click "Si, continuar" to confirm payment intent
  # Step 9: Select payment method
  - Select "Recomendada Tarjeta de débito" as payment method
  - Click "Continuar" to proceed to card entry
  # Step 10: Enter Kushki card details (test card)
  - Enter card number 4456540000000063 in the card number field
  - Enter "prueba pago" as cardholder name
  - Enter 12/26 as expiration date
  - Enter 123 as CVV security code
  - Click "Confirmar" button to process payment
  # Step 11: Complete payment
  - Click "Omitir" to skip the post-payment survey
  - Verify the "¡Felicitaciones!" success message is displayed
  - Click "Volver al inicio" to return to the home page
expected_result: El pago se completa con éxito y el tutor regresa al inicio desde la pantalla de confirmación
