name: Se muestra SIN stock una orden opcional cuando el stock es igual a 0
page: /guardians
page_path: apps/guardian_frontend/pages/guardians/[guardianHash]/index.tsx
starting_url: https://api-demo.dev.getcometa.com/cometa_admin/students/guardian/
hooks:
  before:
    # Obtener datos de la escuela
    - helper: getSchoolIdByName
      file_path: apps/e2e/helpers/commons.ts
      args: ["Instituto Internacional Carlos"]
      as: schoolId

    - helper: getFiscalEntityBySchoolId
      file_path: apps/e2e/helpers/commons.ts
      args: ["{{schoolId}}"]
      as: fiscalEntity

    - helper: getBankAccountBySchoolName
      file_path: apps/e2e/helpers/commons.ts
      args: ["Instituto Internacional Carlos"]
      as: bankAccount

    - helper: getActiveSchoolCycleBySchoolId
      file_path: apps/e2e/helpers/commons.ts
      args: ["{{schoolId}}", true]
      as: cycle

    - helper: getLevelIdBySchoolId
      file_path: apps/e2e/helpers/commons.ts
      args: ["{{schoolId}}", "Primaria"]
      as: levelId

    - helper: getSectionIdBySchoolId
      file_path: apps/e2e/helpers/commons.ts
      args: ["{{schoolId}}", "{{levelId}}"]
      as: sectionId

    # Generar datos del estudiante
    - helper: generateFirstName
      file_path: apps/e2e/helpers/students.ts
      as: firstName

    - helper: generateLastName
      file_path: apps/e2e/helpers/students.ts
      as: lastName

    - helper: generateLastName
      file_path: apps/e2e/helpers/students.ts
      as: studentMotherLastName

    - helper: generateMatricula
      file_path: apps/e2e/helpers/students.ts
      as: matricula

    - helper: generarCURP
      file_path: apps/e2e/helpers/commons.ts
      args: ["{{lastName}}", "{{studentMotherLastName}}", "{{firstName}}"]
      as: curp

    # Generar datos del tutor
    - helper: generateFirstName
      file_path: apps/e2e/helpers/students.ts
      as: guardianFirstName

    - helper: generateLastName
      file_path: apps/e2e/helpers/students.ts
      as: guardianLastName

    # Crear concepto opcional con atributos
    - helper: createOtherConceptByApi
      file_path: apps/e2e/helpers/concepts.ts
      args:
        [
          "Concepto SinStock Test",
          "{{fiscalEntity}}",
          "{{bankAccount.id}}",
          "{{cycle[0].id}}",
          "{{schoolId}}",
          true,
        ]
      as: concept

    # Crear estudiante
    - helper: createStudentWithParams
      file_path: apps/e2e/helpers/students.ts
      args:
        [
          "{{firstName}}",
          "{{lastName}}",
          "{{matricula}}",
          "{{levelId}}",
          "{{sectionId}}",
          "{{schoolId}}",
          "{{curp}}",
          null,
          null,
          "{{cycle[0].id}}",
        ]
      as: studentId

    - helper: generateEmail
      file_path: apps/e2e/helpers/commons.ts
      args: ["{{guardianFirstName}}", "{{guardianLastName}}"]
      as: guardianEmail

    - helper: assignGuardianAPI
      file_path: apps/e2e/helpers/students.ts
      args:
        [
          "{{studentId}}",
          "{{schoolId}}",
          "{{guardianFirstName}}",
          "{{guardianLastName}}",
          "{{guardianEmail}}",
        ]
      as: guardianName

    - helper: addOptionalOrdersToStudent
      file_path: apps/e2e/helpers/concepts.ts
      args: ["{{studentId}}", "{{concept.id}}"]
      as: assignmentId

    # Obtener ordenes opcionales y configurar stock a 0
    - helper: apiGetSchoolsOptionalConceptsOrdersList
      file_path: apps/e2e/helpers/concepts.ts
      args: ["{{concept.id}}", "{{schoolId}}"]
      as: optionalOrders

    - helper: apiSchoolsStockChangeLimitPartialUpdate
      file_path: apps/e2e/helpers/concepts.ts
      args: ["{{optionalOrders[1].stock.id}}", "{{schoolId}}", true]
      as: stockLimitSet

task: Verificar que una orden opcional muestra el boton "SIN STOCK" cuando el stock de la variante es igual a 0
steps:
  # Step 1: Login to Django Admin
  - Enter email automationadmin@getcometa.com in the "Email address" field
  - Enter password barriletecosmico in the "Password" field
  - Click "Log in" button

  # Step 2: Search and select the guardian
  - Enter "{{data.guardianFirstName}} {{data.guardianLastName}}" in the search box
  - Click "Search" button
  - Select the checkbox next to the guardian {{data.guardianEmail}} in the results table

  # Step 3: Generate Auth URL
  - Select "Generate Auth URL" from the "Action" dropdown
  - Click "Go" button
  - Wait for the auth URL to be generated and displayed
  - Copy the guardian portal URL from the "Auth url for..." message

  # Step 4: Navigate to Guardian Portal
  - Extract the token from the "Auth url for..." message
  - Construct the portal URL by concatenating https://portal.demo.getcometa.com with the extracted token
  - Navigate to the constructed guardian portal URL

  # Step 5: Complete Onboarding
  - Accept terms and conditions checkbox
  - Click "Comenzar" button to start onboarding
  - Click "Continuar" to skip guardian data section
  - Click "Continuar" to skip student data section
  - Click "Por ahora no" to skip billing information
  - Click "Iniciar" to complete onboarding and go to home

  # Step 6: Close any tour messages
  - Close any tour or helper messages if displayed

  # Step 7: Verify SIN STOCK button
  - Verify the "SIN STOCK" button is visible for the variant with stock = 0
expected_result: Se muestra el boton "SIN STOCK" deshabilitado para la variante del concepto opcional que tiene stock igual a 0
