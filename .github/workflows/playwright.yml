name: Playwright Tests
on:
  schedule:
    - cron: '0 6 * * 1,5' # Ejecutar a medianoche (hora local) todos los días
  workflow_dispatch: # Permitir activación manual

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Cambiar al directorio apps/dashboard
        run: cd apps/dashboard
      - name: Run Playwright tests
        run: ENV=demo npx playwright test --grep=@sanity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
